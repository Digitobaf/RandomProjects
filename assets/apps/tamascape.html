 async prepare(scene){const saved=this.cache.get(scene.id);if(saved?.src===scene.image)return saved;const data={id:scene.id,src:scene.image,original:await this.image(scene.image)};const pixels=data.original.getContext('2d').getImageData(0,0,512,512);data.pixels=pixels;

 character(pixels,[x,y,w,h]){const mask=new Uint8Array(512*512),a=pixels.data;for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++){const i=(yy*512+xx)*4,r=a[i],g=a[i+1],b=a[i+2];if(g>r*1.04&&g>b*1.35&&g>130)mask[yy*512+xx]=1;}
  const closed=this.dilate(mask,2),seen=new Uint8Array(mask.length),queue=new Int32Array(mask.length);let head=0,tail=0;for(let i=0;i<512;i++)for(const n of [i,i+511*512,i*512,i*512+511])if(!closed[n]&&!seen[n]){seen[n]=1;queue[tail++]=n;}

 }
 // Kuchipatchi's body plus every navy contour pixel, so the outline never changes thickness.
 beachCharacter(pixels,roi){const mask=this.character(pixels,roi),near=this.dilate(mask,6),a=pixels.data;for(let y=roi[1];y<roi[1]+roi[3];y++)for(let x=roi[0];x<roi[0]+roi[2];x++){const n=y*512+x,i=n*4;if(near[n]&&a[i]+a[i+1]+a[i+2]<330&&a[i+1]<120)mask[n]=1;}return mask;}

 outlined(pixels,roi,r,skip){const mask=this.character(pixels,roi);if(skip)for(let i=0;i<mask.length;i++)if(mask[i]&&skip(i%512,i>>9))mask[i]=0;const near=this.dilate(mask,r),a=pixels.data;for(let y=roi[1];y<roi[1]+roi[3];y++)for(let x=roi[0];x<roi[0]+roi[2];x++){const n=y*512+x,i=n*4;if(near[n]&&a[i]+a[i+1]+a[i+2]<330&&a[i+1]<120)mask[n]=1;}return mask;}
 // Same idle as Kuchipatchi: squash & stretch anchored at the feet, nearest-neighbour. s=-1..1 (or 0..2 = stretch only).
 breathe(g,img,k,s,wide=.018){const h=Math.round(k.h*(1+.025*s)),w=k.w+2*Math.round(k.w*-wide*s/2);g.drawImage(img,k.x,k.y,k.w,k.h,k.x+(k.w-w)/2,k.y+k.h-h,w,h);}
 breath(ms){return Math.sin(2*Math.PI*(ms%2400)/2400);}
 // Character cut out of art that has no clean plate: background behind him rebuilt from neighbouring pixels.
 standIn(pixels,roi,r,grow,rows,skip){const body=this.outlined(pixels,roi,r,skip);if(skip)for(let i=0;i<body.length;i++)if(body[i]&&skip(i%512,i>>9))body[i]=0;const hole=grow?this.dilate(body,grow):body.slice();if(skip)for(let i=0;i<hole.length;i++)if(hole[i]&&skip(i%512,i>>9))hole[i]=0;const keep=hole.slice(),plate=new ImageData(new Uint8ClampedArray(pixels.data),512,512);if(rows)for(let y=rows[0];y<=rows[1];y++)for(let i=4;i<512;i++){const x=rows[2]?i:511-i,from=rows[2]?-4:4,n=y*512+x;if(hole[n]&&!hole[n+from]){for(let c=0;c<4;c++)plate.data[n*4+c]=plate.data[(n+from)*4+c];hole[n]=0;}}this.fill(plate,hole);return {body,plate,sprite:this.cut(pixels,keep),k:this.box(keep)};}
 // ---- Office ----
 officeIdle(data,pixels){const s=this.standIn(pixels,[140,232,185,150],4,1,[368,381]),a=pixels.data,hole=new Uint8Array(512*512),cx=66,cy=98;
  // lift the printed clock hands off the face (hour/minute marks stay)
  for(let y=cy-34;y<=cy+34;y++)for(let x=cx-34;x<=cx+34;x++){const dx=x-cx,dy=y-cy,i=(y*512+x)*4;if(dx*dx+dy*dy>1190||(Math.abs(dy)<=6&&Math.abs(dx)>=22))continue;if(a[i]+a[i+1]+a[i+2]<330&&a[i+1]<120)hole[y*512+x]=1;}
  const hands=this.dilate(hole,2);for(let y=cy-36;y<=cy+36;y++)for(let x=cx-36;x<=cx+36;x++){const dx=x-cx,dy=y-cy,n=y*512+x;if(dx*dx+dy*dy>1190||(Math.abs(dy)<=6&&Math.abs(dx)>=22))hands[n]=0;}
  this.fill(s.plate,hands);data.plate=this.paint(s.plate);data.k=s.k;
  // typing poses: rest, left paw up, right paw up (paws lift 4px; the vacated keys show through)
  const lift=(x0,x1,ramp,y0)=>{const im=new ImageData(new Uint8ClampedArray(s.sprite.data),512,512),src=s.sprite.data;for(let y=y0;y<392;y++)for(let x=x0-ramp;x<=x1;x++){const wx=Math.min(1,(x-x0+ramp+1)/(ramp+1)),wy=Math.min(1,(y-y0+1)/8),d=Math.round(4*wx*wy),to=(y*512+x)*4,from=((y+d)*512+x)*4;for(let c=0;c<4;c++)im.data[to+c]=src[from+c];}return this.paint(im);};
  data.typing=[this.paint(s.sprite),lift(262,279,26,336),lift(281,318,2,340)];
 }
 clockHands(g){const t=new Date(),sec=t.getSeconds(),min=t.getMinutes()+sec/60,hr=t.getHours()%12+min/60,cx=66,cy=98,hand=(turn,len,size,color)=>{const a=turn*2*Math.PI,o=size>>1;g.fillStyle=color;for(let r=0;r<=len;r++)g.fillRect(Math.round(cx+Math.sin(a)*r)-o,Math.round(cy-Math.cos(a)*r)-o,size,size);};
  hand(hr/12,20,4,'#090887');hand(min/60,30,4,'#090887');hand(sec/60,27,2,'#e9609f');g.fillStyle='#090887';g.fillRect(cx-3,cy-3,6,6);}
 drawOffice(g,data,ms){g.drawImage(data.plate,0,0);this.clockHands(g);
  // 2 s typing phrase on a 125 ms grid: paw up on one beat, key down on the next.
  const beat=Math.floor(ms/125)%16,phrase='L-R-L-R-L-L-R---',pose=phrase[beat],last=phrase[(beat+15)%16];
  this.breathe(g,data.typing[pose==='L'?1:pose==='R'?2:0],data.k,1+this.breath(ms),.009);
  if(pose==='-'&&last!=='-'){g.fillStyle='rgba(150,110,60,.38)';if(last==='L')g.fillRect(265,383,12,5);else g.fillRect(295,383,11,5);}}
 // ---- Train / cafe ----
 cafeIdle(data,pixels,plate){const body=this.outlined(pixels,[128,236,190,184],4),m=data.mask;for(let i=0;i<m.length;i++)if(m[i])body[i]=1;const keep=this.dilate(body,1),erase=this.dilate(body,3),bg=new ImageData(new Uint8ClampedArray(pixels.data),512,512);for(let i=0;i<erase.length;i++)if(erase[i])for(let c=0;c<4;c++)bg.data[i*4+c]=plate.data[i*4+c];data.idleBackground=this.paint(bg);data.body=this.paint(this.cut(pixels,keep));data.k=this.box(keep);}
 // The passenger never touches the window view: green scenery inside Codex's glass outline (and the window frame and sill
 // beside his head) is not part of him, he is clipped
 // out of the glass, and he breathes by filling out sideways from his seat (his head never moves), so the view and the
 // frame around it are never touched and nothing behind him is ever uncovered.
 trainIdle(data,pixels){const glass=new Path2D('M125 158H389L397 162L402 169L404 176V264L397 268L391 273H357V276H349V279H343V282H338V286H334V289H131V285L127 279L122 274L116 270L108 267V176L112 168L118 162Z'),probe=this.make().getContext('2d');data.glass=glass;const s=this.standIn(pixels,[288,262,172,166],4,2,[290,302,1],(x,y)=>(y<292&&probe.isPointInPath(glass,x+.5,y+.5))||(y>=286&&y<295&&x<326)||(y<284&&x>397));data.plate=this.paint(s.plate);data.k=s.k;data.body=this.paint(s.sprite);}
 trainBreathe(g,data,width,offset,ms){const k=data.k,w=k.w+2*Math.round(k.w*.02*(1+this.breath(ms))/2);g.save();const room=new Path2D();room.rect(-16,-16,544,544);room.addPath(data.glass);g.clip(room,'evenodd');g.drawImage(data.body,k.x,k.y,k.w,k.h,k.x+(k.w-w)/2,k.y,w,k.h);g.restore();}
 // ---- Beach surf: the water edge runs up the sand and back (4.8 s) ----
 surf(plate){const a=plate.data,edge=new Int16Array(512),raw=new Int16Array(512),shore=[[0,327],[60,337],[110,351],[170,360],[225,369],[280,376],[340,390],[410,400],[470,406],[511,405]],water=(x,y)=>{const i=(y*512+x)*4;return a[i+2]>205||a[i+2]>a[i]+10||(a[i+1]<190&&a[i]>140);};
  for(let x=0;x<512;x++){let i=0;while(i<shore.length-2&&x>shore[i+1][0])i++;const [x0,y0]=shore[i],[x1,y1]=shore[i+1],line=Math.round(y0+(y1-y0)*(x-x0)/(x1-x0));let y=line-12;while(y<line+16&&(water(x,y+1)||water(x,y+2)||water(x,y+3)))y++;raw[x]=y;}
  for(let x=0;x<512;x++){const v=[];for(let j=Math.max(0,x-8);j<=Math.min(511,x+8);j++)v.push(raw[j]);v.sort((p,q)=>p-q);edge[x]=v[v.length>>1];raw[x]=Math.max(edge[x]-4,Math.min(edge[x]+4,raw[x]));}
  // water near the shore slides down d px as one piece; the open water above it stretches to follow (no gaps, no blur)
  const frames=[];for(let d=0;d<=11;d++){const out=new ImageData(new Uint8ClampedArray(a),512,512);if(d)for(let x=0;x<512;x++){const top=edge[x]-50,foam=Math.min(edge[x]-14,raw[x]-1);for(let y=top;y<=raw[x]+d&&y<512;y++){const sy=y>foam+d?y-d:top+Math.floor((y-top)*(foam-top)/(foam+d-top)),to=(y*512+x)*4,from=(sy*512+x)*4;for(let c=0;c<4;c++)out.data[to+c]=a[from+c];}}frames.push(this.paint(out));}
  return {frames,edge:raw};}
 drawSurf(g,surf,ms){const p=(ms%4800)/4800,rise=p<.42,u=rise?p/.42:(p-.42)/.58,d=Math.round(11*(rise?Math.sin(u*Math.PI/2):Math.cos(u*Math.PI/2)));g.drawImage(surf.frames[d],0,0);
  // wet sand left behind while the water slides back
  if(!rise&&d<11){g.fillStyle='rgba(150,96,40,'+(.16*(1-u)).toFixed(3)+')';for(let x=0;x<512;x++){const y=surf.edge[x]+d+1,h=11-d;if(h>0)g.fillRect(x,y,1,h);}}}
 pause(){clearTimeout(this.timer);this.timer=0;}
 resume(){if(this.timer||!this.current||document.hidden||this.reduced.matches)return;const tick=()=>{this.timer=0;if(document.hidden||!this.current)return;this.drawAt(performance.now()-this.epoch);this.timer=setTimeout(tick,125);};this.timer=setTimeout(tick,125);}
};

</script><script>
(()=>{'use strict';
const config=JSON.parse(document.getElementById('tamaConfig').textContent),skins=config.skins,scenes=config.scenes,KEY='TamaScape:preferences:v1';
const $=id=>document.getElementById(id),audio=$('ambience'),clamp=(v,min,max)=>Math.max(min,Math.min(max,v));
let state={skin:0,scene:0,volume:.5};try{const p=JSON.parse(localStorage.getItem(KEY)||'null');if(p){if(Number.isInteger(p.skin))state.skin=clamp(p.skin,0,skins.length-1);if(Number.isInteger(p.scene))state.scene=clamp(p.scene,0,scenes.length-1);if(Number.isFinite(p.volume))state.volume=clamp(p.volume,0,1);}}catch(_){}
let currentSource='',playEpoch=0,openingHeard=false,skipUiUntil=0,activeUi=null;
const motion=new TamaSceneRenderer($('sceneCanvas')),uiEvents=[],uiClips={};for(const [name,src] of Object.entries(config.interfaceSounds||{})){const clip=new Audio(src);clip.preload='auto';uiClips[name]=clip;}
function playUi(name){const clip=uiClips[name];if(!clip||state.volume<=0||name!=='open'&&performance.now()<skipUiUntil)return;if(activeUi){activeUi.pause();activeUi.currentTime=0;}activeUi=clip;clip.volume=state.volume*.7;clip.currentTime=0;clip.play().then(()=>{if(name==='open')openingHeard=true;uiEvents.push({name,at:performance.now()});}).catch(()=>{});}
function activate(){if(!openingHeard){skipUiUntil=performance.now()+200;playUi('open');}resumeAudio();}
$('tama').addEventListener('pointerdown',activate,{capture:true});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));}catch(_){}};
const prepared=skins.map(s=>{const image=new Image();image.src=s.image;return image;});
async function renderSkin(){const index=state.skin,skin=skins[index];try{await prepared[index].decode();}catch(_){}if(index!==state.skin)return;$('shell').src=skin.image;$('shell').alt=skin.name+' TamaScape skin';for(const [i,id] of ['skinButton','sceneButton','volumeButton'].entries()){const b=skin.buttons[i];Object.assign($(id).style,{left:b.x/1536*100+'%',top:b.y/1710*100+'%',width:b.rx*2/1536*100+'%',height:b.ry*2/1710*100+'%'});}$('skinButton').title='Skin · '+skin.name;$('skinButton').setAttribute('aria-label','Next skin. Current: '+skin.name);}
function setVolume(value,announce=false){state.volume=Math.round(clamp(value,0,1)*100)/100;audio.volume=state.volume;for(const clip of Object.values(uiClips))clip.volume=state.volume*.7;const percent=Math.round(state.volume*100);$('volumeButton').setAttribute('aria-valuenow',percent);$('volumeButton').setAttribute('aria-valuetext',percent+' percent');$('volumeReadout').textContent=percent+'%';if(announce)$('live').textContent='Volume '+percent+' percent';save();}
async function resumeAudio(){if(!currentSource)return;const token=playEpoch;try{await audio.play();if(token!==playEpoch)return;}catch(_){/* The next physical button press retries browser audio activation. */}}
function renderScene(){const scene=scenes[state.scene];$('sceneName').textContent=scene.name;$('sceneName').hidden=!!scene.image;$('sceneImage').hidden=true;$('sceneCanvas').hidden=!scene.image;const animationReady=motion.setScene(scene);$('sceneButton').title='Scene · '+scene.name;$('sceneButton').setAttribute('aria-label','Next scene. Current: '+scene.name);$('screen').setAttribute('aria-label',scene.name+' scene');const next=scene.audio||'';if(next!==currentSource){playEpoch++;audio.pause();currentSource=next;if(next){audio.src=next;audio.load();}else{audio.removeAttribute('src');audio.load();}}audio.loop=true;resumeAudio();return animationReady;}
function nextSkin(){state.skin=(state.skin+1)%skins.length;renderSkin();save();resumeAudio();playUi('skin');}
function nextScene(){state.scene=(state.scene+1)%scenes.length;renderScene();save();playUi('scene');$('live').textContent=scenes[state.scene].name;}
$('skinButton').addEventListener('click',nextSkin);$('sceneButton').addEventListener('click',nextScene);
$('volumeButton').addEventListener('wheel',event=>{if(event.ctrlKey||event.metaKey||!event.deltaY)return;event.preventDefault();const unit=event.deltaMode===1?3:event.deltaMode===2?1:100;const steps=Math.max(1,Math.round(Math.abs(event.deltaY)/unit));setVolume(state.volume-Math.sign(event.deltaY)*steps*.05,true);resumeAudio();},{passive:false});
$('volumeButton').addEventListener('keydown',event=>{const steps={ArrowUp:.05,ArrowRight:.05,ArrowDown:-.05,ArrowLeft:-.05,PageUp:.1,PageDown:-.1};if(event.key in steps){event.preventDefault();setVolume(state.volume+steps[event.key],true);}else if(event.key==='Home'||event.key==='End'){event.preventDefault();setVolume(event.key==='Home'?0:1,true);}});
for(const id of ['skinButton','sceneButton','volumeButton'])$(id).addEventListener('pointerdown',resumeAudio);
setVolume(state.volume);const ready=Promise.all([...prepared.map(i=>i.decode().catch(()=>{})),renderScene()]).then(renderSkin).then(()=>{$('tama').classList.add('is-ready');playUi('open');}); 
window.addEventListener('pagehide',()=>audio.pause());
window.TamaScape={ready,activate,suspend(){for(const clip of Object.values(uiClips))clip.pause();motion.pause();},resume(){motion.resume();resumeAudio();},animation:motion,uiEvents:()=>uiEvents.slice(),nextSkin,nextScene,setVolume,value:()=>({...state,skinId:skins[state.skin].id,sceneId:scenes[state.scene].id,loop:audio.loop}),setMedia(id,media){const scene=scenes.find(s=>s.id===id);if(!scene)throw new Error('Unknown TamaScape scene');for(const key of ['image','audio'])if(key in media){if(media[key]!==null&&typeof media[key]!=='string')throw new TypeError('Scene media must be a URL or null');scene[key]=media[key];}if(scene===scenes[state.scene])renderScene();},sceneNames:scenes.map(s=>s.name)};
})();
</script></body></html>
