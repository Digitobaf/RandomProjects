<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="simpom-version" content="pollux-review-v3"><title>SimPom — Working Mockup</title><link rel="stylesheet" href="style.css"></head><body><main><div id="sims-pomodoro-preview"><div class="sp-layout"><section class="sp-widget" aria-label="SimPom widget">
<div class="sp-object"><button type="button" class="sp-sprite-button" aria-label="Interact with selected object"><canvas class="sp-canvas" role="img" aria-label="Selected Sims object"></canvas></button></div>
<div class="sp-rotation"><button type="button" class="sp-turn" data-action="left" aria-label="Rotate left"><span class="sp-game-icon sp-left-icon" aria-hidden="true"></span></button><span class="sp-object-caption"></span><button type="button" class="sp-turn" data-action="right" aria-label="Rotate right"><span class="sp-game-icon sp-right-icon" aria-hidden="true"></span></button></div>
<div class="sp-panel"><div class="sp-clock-row"><label><span class="sp-sr">Timer phase</span><select class="sp-phase" aria-label="Timer phase"><option value="focus">Focus</option><option value="break">Break</option><option value="long">Long break</option></select></label><output class="sp-clock" role="timer" aria-label="Time remaining">25:00</output><button class="sp-buy" type="button" data-action="catalog" aria-label="Buy Mode: choose object" aria-expanded="true"><span class="sp-game-icon sp-buy-icon" aria-hidden="true"></span></button></div>
<div class="sp-actions"><button type="button" class="sp-button" data-action="start">Start</button><button type="button" class="sp-button" data-action="pause" disabled>Pause</button><button type="button" class="sp-button" data-action="reset">Reset</button></div>
<div class="sp-bottom-row"><button type="button" class="sp-disclosure" data-action="settings" aria-expanded="false"><span class="sp-disclosure-mark">▸</span> Durations</button><button type="button" class="sp-disclosure sp-sound-button" data-action="sound" aria-pressed="true">Sound: on</button><span class="sp-session"></span></div>
<div class="sp-settings" hidden><div class="sp-duration-grid"><label>Focus <span class="sp-unit">min</span><input aria-label="Focus minutes" data-duration="focus" type="number" min="0.05" max="1440" step="any"></label><label>Break <span class="sp-unit">min</span><input aria-label="Break minutes" data-duration="break" type="number" min="0.05" max="1440" step="any"></label><label>Long break <span class="sp-unit">min</span><input aria-label="Long break minutes" data-duration="long" type="number" min="0.05" max="1440" step="any"></label></div><label class="sp-cycle-label">Long break after <input class="sp-cycles" aria-label="Sessions before long break" type="number" min="1" max="12"> sessions</label><div class="sp-preview-options"><label>Volume <input class="sp-volume" aria-label="Object volume" type="range" min="0" max="1" step="0.01"></label><label><input class="sp-enhanced" type="checkbox" checked> Enhanced small sprites</label><label><input class="sp-sharp" type="checkbox"> Sharp pixels</label></div><span class="sp-error" role="alert" hidden></span></div></div><p class="sp-mode-status"></p><p class="sp-announcement" role="status" aria-live="polite"></p></section>
<aside class="sp-catalog" aria-label="Buy Mode object catalog"><div class="sp-catalog-heading"><span>Buy Mode</span><button class="sp-catalog-close" type="button" data-action="catalog" aria-label="Close catalog">×</button></div><input class="sp-search" type="search" placeholder="Find an object…" aria-label="Find object"><div class="sp-catalog-grid" aria-label="Picked objects"></div><div class="sp-pages"><button type="button" class="sp-button" data-action="prev" aria-label="Previous objects">‹</button><span class="sp-page-label"></span><button type="button" class="sp-button" data-action="next" aria-label="Next objects">›</button></div><div class="sp-catalog-footer"><span class="sp-selected-name"></span><span class="sp-count">95 picks</span></div></aside></div></div></main><script src="objects.js"></script><script src="behaviors.js"></script><script src="upscales.js"></script><script src="motion-masks.js"></script><script src="render-model.js"></script><script src="rendering.js"></script><script src="player.js"></script></body></html>
